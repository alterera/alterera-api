services:
  postgres:
    image: postgres:16-alpine
    container_name: alterera-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alterera
      POSTGRES_PASSWORD: alterera
      POSTGRES_DB: alterera_api
    ports:
      - '5432:5432'
    volumes:
      - alterera_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alterera -d alterera_api']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alterera-api-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - alterera_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  alterera_pg_data:
  alterera_redis_data:
